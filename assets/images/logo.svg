<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" fill="none">

  <!-- Outer hexagon border — deep navy -->
  <path d="M290,22 L430,102 L430,262 L290,342 L150,262 L150,102 Z"
        stroke="#0C2340" stroke-width="13" stroke-linejoin="round" fill="none"/>

  <!-- Inner hexagon ring — medium navy for depth -->
  <path d="M290,40 L416,112 L416,250 L290,322 L164,250 L164,112 Z"
        stroke="#1A3A5C" stroke-width="4.5" stroke-linejoin="round" fill="none"/>

  <!-- Road band — diagonal sweep lower-left to upper-right -->
  <path d="M164,278 Q220,248 275,218 Q330,188 418,158"
        stroke="#1A3A5C" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Road center dashes — light surface color -->
  <path d="M175,270 Q222,245 265,222"
        stroke="#E8F0F8" stroke-width="3" stroke-dasharray="14,10"
        stroke-linecap="round" fill="none"/>

  <!-- ── Car silhouette ── -->
  <!-- Lower body / chassis -->
  <path d="M196,216 L210,187 L258,178 L338,178 L364,190 L386,200 L388,216 Z"
        fill="#0C2340"/>

  <!-- Cabin / roof -->
  <path d="M215,187 L232,164 L282,156 L325,158 L350,177"
        fill="#1A3A5C"/>

  <!-- Left window -->
  <path d="M220,183 L233,166 L272,160 L276,183 Z"
        fill="#E8F0F8" fill-opacity="0.45"/>

  <!-- Right window -->
  <path d="M282,183 L284,160 L320,162 L340,176 L328,183 Z"
        fill="#E8F0F8" fill-opacity="0.45"/>

  <!-- Left wheel -->
  <circle cx="248" cy="217" r="16" fill="#0C2340" stroke="#E8F0F8" stroke-width="2.5"/>
  <circle cx="248" cy="217" r="6.5" fill="#E8F0F8"/>

  <!-- Right wheel -->
  <circle cx="355" cy="217" r="16" fill="#0C2340" stroke="#E8F0F8" stroke-width="2.5"/>
  <circle cx="355" cy="217" r="6.5" fill="#E8F0F8"/>

  <!-- Speed lines — amber accent -->
  <line x1="184" y1="202" x2="200" y2="202" stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
  <line x1="181" y1="210" x2="196" y2="210" stroke="#F5A623" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="183" y1="218" x2="197" y2="218" stroke="#F5A623" stroke-width="2" stroke-linecap="round"/>

  <!-- ── Checkmark — amber, large, prominent ── -->
  <path d="M180,270 L232,322 L384,214"
        stroke="#F5A623" stroke-width="30"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Checkmark inner highlight — light amber -->
  <path d="M186,268 L232,318 L380,212"
        stroke="#FFC85A" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>

  <!-- ── Wordmark ── -->
  <!-- TRIP — heavy weight -->
  <text x="290" y="400"
        text-anchor="middle"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="0" fill="#0C2340">
    <tspan font-size="74" font-weight="900" letter-spacing="-1">TRIP</tspan><tspan
          font-family="Arial, 'Helvetica Neue', sans-serif"
          font-size="67" font-weight="400" letter-spacing="0">Reserve</tspan>
  </text>

</svg>
