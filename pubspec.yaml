name: trip_reserve
description: Car booking application for trip reservations
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^13.2.0

  # Backend - Supabase
  supabase_flutter: ^2.3.4

  # Maps
  google_maps_flutter: ^2.5.3
  google_places_flutter: ^2.0.8
  geolocator: ^11.0.0
  geocoding: ^2.2.0

  # Payments
  # paymongo_sdk: ^1.0.0  # Uncomment when ready

  # Forms & Validation
  reactive_forms: ^17.0.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Environment
  flutter_dotenv: ^5.1.0

  # HTTP
  http: ^1.2.0

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.3.3
  url_launcher: ^6.2.4
  package_info_plus: ^9.0.1
  path: ^1.9.0

  # Image/File Picker
  image_picker: ^1.0.7

  # Code Generation
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.14
  freezed: ^3.0.6
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.5
  analyzer: ^7.4.5

  # Testing
  mocktail: ^1.0.3

  # App Icon Generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env
